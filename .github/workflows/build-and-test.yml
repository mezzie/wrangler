name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test on macOS
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift Version
        run: swift --version

      - name: Build Wrangler
        run: swift build -c release

      - name: Run Wrangler Test Suite
        run: swift test
